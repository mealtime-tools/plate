<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- The whole point of the self-contained share link is that opening a recipe
       talks to nobody. `default-src 'none'` makes that a browser-enforced fact
       rather than a promise: no CDN, no font host, no QR service, no analytics.
       `data:` is only there for the empty favicon that suppresses /favicon.ico.
       The page has no API, analytics, fonts, or other network dependency. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">

  <title>Recipe</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>

<body>
  <main>
    <section id="editor-nav" class="editor-nav" hidden>
      <div class="editor-meta">
        <div class="meta-field">
          <label for="recipe-name-input">Name</label>
          <input id="recipe-name-input" type="text" placeholder="Recipe Name">
        </div>
        <div class="meta-field">
          <label for="tags-input">Tags</label>
          <input id="tags-input" type="text" placeholder="dinner, quick">
        </div>
      </div>
    </section>

    <h1 id="recipe-name">Recipe</h1>

    <!-- Failure comes first in the document so it is the first thing read out,
         and the first thing seen on a phone, whatever else rendered. -->
    <section id="alert" class="alert" hidden>
      <h2 id="alert-title">Problem with this link</h2>
      <ul id="alert-list"></ul>
      <p id="alert-note"></p>
    </section>

    <section id="recipe" hidden>
      <div id="controls" class="controls">
        <label for="servings">Servings</label>
        <input id="servings" type="number" min="1" max="999" step="1" value="1" inputmode="numeric">
      </div>
      <p id="servings-line" class="print-only">Servings: <span id="servings-print">1</span></p>

      <p id="no-ingredients" hidden>This recipe carries no ingredients.</p>

      <div id="ingredients-panel" class="scroll">
        <table id="ingredients">
          <caption>Ingredients</caption>
          <thead>
            <tr id="ingredients-header-row">
              <th scope="col">Ingredient</th>
              <th scope="col">g</th>
              <th scope="col">kcal</th>
              <th scope="col" class="abbr" title="Protein, grams">P</th>
              <th scope="col" class="abbr" title="Carbohydrate, grams">C</th>
              <th scope="col" class="abbr" title="Fat, grams">F</th>
              <th scope="col" class="action-col"></th>
            </tr>
          </thead>
          <tbody id="ingredient-rows"></tbody>
          <tfoot id="ingredient-total"></tfoot>
        </table>
      </div>

      <details id="editor-tools" class="editor-tools" hidden>
        <summary>Add ingredients</summary>
        <div class="editor-panels">
          <div class="manual-ingredient-panel">
            <h2>Add Manual Ingredient</h2>
            <div class="manual-grid">
              <input id="manual-name" type="text" placeholder="Name">
              <input id="manual-grams" type="number" min="0" step="any" placeholder="Grams">
              <input id="manual-kcal" type="number" min="0" step="any" placeholder="Total kcal">
              <input id="manual-protein" type="number" min="0" step="any" placeholder="Total P">
              <input id="manual-carbs" type="number" min="0" step="any" placeholder="Total C">
              <input id="manual-fat" type="number" min="0" step="any" placeholder="Total F">
              <button id="manual-add-btn" type="button">Add</button>
            </div>
          </div>
        </div>
      </details>

      <table id="summary" hidden>
        <caption>Nutrition</caption>
        <thead>
          <tr>
            <th scope="col"></th>
            <th scope="col">Whole recipe</th>
            <th scope="col">Per serving</th>
            <th scope="col">Per 100 g</th>
          </tr>
        </thead>
        <tbody id="summary-rows"></tbody>
      </table>

      <section id="notes" hidden>
        <h2>Notes</h2>
        <p id="notes-body"></p>
        <div id="notes-edit" hidden>
          <textarea id="notes-input" rows="4" placeholder="Method or notes..."></textarea>
        </div>
      </section>

    </section>
  </main>
</body>

</html>
