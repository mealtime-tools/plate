[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# `plate` is taken on PyPI, so the distribution is prefixed. The import stays
# `plate`.
name = "mealtime-plate"
version = "0.1.0"
description = "A static page that renders a recipe share link, and the Python handle that locates its files."
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://github.com/mealtime-tools/plate"

[tool.hatch.build.targets.wheel]
packages = ["src/plate"]

# The static files live at the repository root because that is what GitHub
# Pages serves. They are mapped into the package at build time so a Python
# consumer can locate the same bytes; a checked-in second copy would have to be
# kept in sync by hand, and would not be.
[tool.hatch.build.targets.wheel.force-include]
"index.html" = "plate/assets/index.html"
"style.css" = "plate/assets/style.css"
"app.mjs" = "plate/assets/app.mjs"
"api.mjs" = "plate/assets/api.mjs"
"recipe.mjs" = "plate/assets/recipe.mjs"
"qr.mjs" = "plate/assets/qr.mjs"
"yaml.mjs" = "plate/assets/yaml.mjs"
# The contract artifact ships too: a consumer asserting compatibility against
# a file that is missing from the wheel would skip instead of checking.
"fixtures/exported-example.yaml" = "plate/fixtures/exported-example.yaml"

[tool.pytest.ini_options]
testpaths = ["src/plate"]
python_files = ["*_test.py"]
