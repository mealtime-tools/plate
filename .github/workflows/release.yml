name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test & Verify Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: setup-uv dropped its floating major tags after v7,
      # so v8 and later only exist as exact versions.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run the locator suite
        run: uv run pytest

      # The page is what this package ships, so its suite gates the release.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dev dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run the page suite
        run: npm test

  build-and-publish:
    name: Build & Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mealtime-plate
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
      contents: write  # Required for GitHub Release creation

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Build distributions (sdist & wheel)
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
